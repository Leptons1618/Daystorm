name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU torch — the GPU wheels are 2 GB and CI needs none)
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,serve]"
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest -q

  smoke-train:
    # The tests prove the pieces work; this proves they still work together.
    # A repo whose training script broke three commits ago is the standard
    # failure mode of an ML portfolio, and it is invisible to unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]" peft
      - name: Stage A gate (must pass, and must need the sensors to do it)
        run: uv run python -m daystorm.train.stage_a --overfit 6 --steps 250 --batch 6 --lr 1e-3 --scenes 40
      - name: Stage A -> Stage B smoke
        run: |
          uv run python -m daystorm.train.stage_a --scenes 12 --steps 40 --out ckpt/ci
          uv run python -m daystorm.train.stage_b --stage-a ckpt/ci --scenes 12 --steps 20 --out ckpt/ci_b
