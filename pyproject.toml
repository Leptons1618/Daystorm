[project]
name = "daystorm"
version = "0.1.0"
description = "Multimodal driving-scene copilot: camera, CAN bus, radar and cabin audio fused into one language model."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.49",
  "accelerate>=1.0",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "datasets>=3.0",
  "mlflow>=2.16",
]
data = ["nuscenes-devkit>=1.1.11", "pyquaternion>=0.9"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daystorm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
